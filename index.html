function cambiarTab(tab) {
  document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

  if (tab === 'dashboard') {
    document.getElementById('btnDashboard').classList.add('active');
    document.getElementById('dashboardTab').classList.add('active');
    actualizarTablaInventario();
  } else if (tab === 'categorias') {
    document.getElementById('btnCategorias').classList.add('active');
    document.getElementById('categoriasTab').classList.add('active');
    renderVistaCategorias();
  } else {
    document.getElementById('btnHistorial').classList.add('active');
    document.getElementById('historialTab').classList.add('active');
  }
}

function actualizarMetricas() {
  let total = medicamentos.reduce((sum, m) => sum + m.cantidad, 0);
  let vencidos = medicamentos.filter(m => {
    const dias = Math.floor((new Date(m.vencimiento) - new Date()) / (1000 * 60 * 60 * 24));
    return dias <= 30 && dias > 0;
  }).length;
  let bajos = medicamentos.filter(m => m.cantidad < m.minimo).length;
  return { total, vencidos, bajos };
}

  const ahora = new Date();
  historial.push({
    id: Math.max(...historial.map(m => m.id), 0) + 1,
    tipo,
    medicamento,
    cantidad,
    usuario: usuarioActual,
    fecha: ahora.toLocaleDateString('es-AR'),
    hora: ahora.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' }),
    detalles
  });
}

function cerrarModal() {
  document.getElementById('modalOverlay').classList.add('hidden');
}

function guardarMedicamento(e) {
  e.preventDefault();
  const tipo = document.getElementById('tipo').value;
  const categoria = document.getElementById('categoria').value;
  const subcategoria = document.getElementById('subcategoria').value;
  const nombre = document.getElementById('nombre').value;
  const cantidad = parseInt(document.getElementById('cantidad').value);
  const minimo = parseInt(document.getElementById('minimo').value);
  const vencimiento = document.getElementById('vencimiento').value;
  const icono = tiposProducto[tipo] || '📦';

  const id = Math.max(...medicamentos.map(m => m.id), 0) + 1;
  medicamentos.push({ id, nombre, cantidad, minimo, vencimiento, tipo, categoria, subcategoria, icono });

  registrarEnHistorial('Ingreso', nombre, cantidad, 'Ingreso de nuevo medicamento al inventario');
  cerrarModal();
  renderDashboard();
}

function guardarSalida(e) {
  e.preventDefault();
  const medId = parseInt(document.getElementById('medicamentoId').value);
  const cantidad = parseInt(document.getElementById('cantidadSalida').value);
  const detalles = document.getElementById('detallesSalida').value || 'Salida de medicamento';
  const medicamento = medicamentos.find(m => m.id === medId);

  if (!medicamento || medicamento.cantidad < cantidad) {
    alert('Stock insuficiente');
    return;
  }

  medicamento.cantidad -= cantidad;
  registrarEnHistorial('Salida', medicamento.nombre, cantidad, detalles);
  cerrarModal();
  renderDashboard();
}

function eliminarMedicamento(id) {
  if (confirm('¿Eliminar este medicamento del inventario?')) {
    const medicamento = medicamentos.find(m => m.id === id);
    medicamentos = medicamentos.filter(m => m.id !== id);
    registrarEnHistorial('Eliminación', medicamento.nombre, '-', 'Medicamento eliminado del inventario');
    renderDashboard();
  }
}

function aplicarFiltros() {
  filtroActual.tipo = document.getElementById('filtroTipo').value;
  filtroActual.estado = document.getElementById('filtroEstado').value;
  actualizarTablaInventario();
}

function limpiarFiltros() {
  filtroActual = { tipo: '', categoria: '', estado: '' };
  document.getElementById('filtroTipo').value = '';
  document.getElementById('filtroEstado').value = '';
  actualizarTablaInventario();
}

function actualizarTablaInventario() {
  let medicamentosFiltrados = medicamentos;

  if (filtroActual.tipo) {
    medicamentosFiltrados = medicamentosFiltrados.filter(m => m.tipo === filtroActual.tipo);
  }

  if (filtroActual.estado) {
    medicamentosFiltrados = medicamentosFiltrados.filter(m => {
      const diasVencimiento = Math.floor((new Date(m.vencimiento) - new Date()) / (1000 * 60 * 60 * 24));
      if (filtroActual.estado === 'bajo') return m.cantidad < m.minimo;
      if (filtroActual.estado === 'vencimiento') return diasVencimiento <= 30 && diasVencimiento > 0;
      if (filtroActual.estado === 'ok') return m.cantidad >= m.minimo && diasVencimiento > 30;
      return true;
    });
  }

  const tbody = document.getElementById('tablaInventario');
  tbody.innerHTML = medicamentosFiltrados.map(m => {
    const diasVencimiento = Math.floor((new Date(m.vencimiento) - new Date()) / (1000 * 60 * 60 * 24));
    const estado = m.cantidad < m.minimo ? '#ef4444' : diasVencimiento <= 30 ? '#f59e0b' : '#10b981';
    const estadoLabel = m.cantidad < m.minimo ? '🔴' : diasVencimiento <= 30 ? '🟠' : '🟢';

    return `
      <tr style="border-bottom: 1px solid var(--divider);">
        <td style="padding: 1rem 0.75rem;">${m.icono} ${m.nombre}</td>
        <td style="text-align: center; padding: 1rem 0.75rem; font-size: 0.85rem;"><span style="background: var(--primary-light); color: var(--primary); padding: 0.3rem 0.6rem; border-radius: 4px; font-weight: 500;">${m.tipo}</span></td>
        <td style="text-align: center; padding: 1rem 0.75rem; font-size: 0.85rem; color: var(--text-muted);">${m.categoria}</td>
        <td style="text-align: center; padding: 1rem 0.75rem; font-weight: 600; color: ${estado};">${estadoLabel} ${m.cantidad}</td>
        <td style="text-align: center; padding: 1rem 0.75rem;">${m.minimo}</td>
        <td style="text-align: center; padding: 1rem 0.75rem; color: var(--text-muted);">${new Date(m.vencimiento).toLocaleDateString('es-AR')}</td>
        <td style="text-align: center; padding: 1rem 0.75rem;">
          <button onclick="eliminarMedicamento(${m.id})" style="padding: 0.4rem 0.8rem; background: #ef4444; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 0.8rem; font-weight: 600;">Eliminar</button>
        </td>
      </tr>
    `;
  }).join('');
}

function renderVistaCategorias() {
  // Agrupar medicamentos por tipo y categoría
  const agrupados = {};

  medicamentos.forEach(m => {
    if (!agrupados[m.tipo]) agrupados[m.tipo] = {};
    if (!agrupados[m.tipo][m.categoria]) agrupados[m.tipo][m.categoria] = [];
    agrupados[m.tipo][m.categoria].push(m);
  });

  const container = document.getElementById('vistaCategorias');
  let html = '';

  Object.keys(agrupados).forEach(tipo => {
    html += `
      <div style="margin-bottom: 2rem;">
        <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1.5rem;">
          <span style="font-size: 1.5rem;">${tiposProducto[tipo]}</span>
          <h2 style="margin: 0; font-size: 1.5rem; color: var(--primary);">${tipo}</h2>
          <span style="background: var(--primary-light); color: var(--primary); padding: 0.25rem 0.75rem; border-radius: 12px; font-size: 0.85rem; font-weight: 600;">${Object.values(agrupados[tipo]).reduce((sum, arr) => sum + arr.length, 0)} items</span>
        </div>

        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; margin-bottom: 2rem;">
          ${Object.keys(agrupados[tipo]).map(categoria => `
            <div style="background: var(--bg-secondary); border: 1px solid var(--divider); border-radius: 8px; padding: 1.5rem;">
              <h3 style="margin: 0 0 1rem 0; font-size: 1.05rem; color: var(--text);">${categoria}</h3>
              <div style="display: flex; flex-direction: column; gap: 0.75rem;">
                ${agrupados[tipo][categoria].map(m => {
                  const diasVencimiento = Math.floor((new Date(m.vencimiento) - new Date()) / (1000 * 60 * 60 * 24));
                  const estado = m.cantidad < m.minimo ? '🔴' : diasVencimiento <= 30 ? '🟠' : '🟢';
                  const color = m.cantidad < m.minimo ? '#ef4444' : diasVencimiento <= 30 ? '#f59e0b' : '#10b981';

                  return `
                    <div style="display: flex; justify-content: space-between; align-items: center; padding: 0.75rem; background: var(--bg); border-radius: 6px; border-left: 3px solid ${color};">
                      <div style="flex: 1;">
                        <div style="font-weight: 600; font-size: 0.95rem;">${m.icono} ${m.nombre}</div>
                        <div style="font-size: 0.8rem; color: var(--text-muted);">${m.subcategoria}</div>
                      </div>
                      <div style="text-align: right;">
                        <div style="font-weight: 700; color: ${color}; font-size: 1.1rem;">${estado} ${m.cantidad}</div>
                        <div style="font-size: 0.75rem; color: var(--text-muted);">de ${m.minimo}</div>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  });

  container.innerHTML = html;
}

function logout() {
  registrarEnHistorial('Logout', '-', '-', 'Cierre de sesión');
  window.location.hash = '';
  location.reload();
}

if (window.location.hash === '#dashboard') {
  renderDashboard();
}
</script>
